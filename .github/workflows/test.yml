name: Tests

# This workflow runs the google.golang.org/protobuf test suite across supported
# Go versions, Linux distributions, and cross-compilation targets.  Pull
# requests from branches within this repository run on every commit, while pull
# requests from forked repositories require a ":a: safe for tests" label
# (removed immediately after starting) on each commit.

on:
  # postsubmit
  push:
    branches:
      - master
      - staging

  # continuous
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"

  # safe presubmit
  pull_request:
    branches:
      - master
      - staging

  # unsafe presubmit
  pull_request_target:
    branches:
      - master
      - staging
    types: [labeled, opened, reopened, synchronize]

permissions:
  contents: read

env:
  # Always use the Go toolchain installed below.
  GOTOOLCHAIN: local

jobs:
  test:
    # Avoid running tests twice on PR updates.  If the PR is coming from our
    # repository, it's safe and we can use `pull_request`.  Otherwise, we should
    # use `pull_request_target`, and only once the safe label has been added.
    if: |
      (github.event_name != 'pull_request' &&
       github.event_name != 'pull_request_target' &&
       github.event.repository.full_name == 'protocolbuffers/protobuf-go') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == 'protocolbuffers/protobuf-go') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name != 'protocolbuffers/protobuf-go' &&
       github.event.label.name == ':a: safe for tests')
    strategy:
      fail-fast: false   # Don't cancel all jobs if one fails.
      matrix:
        config:
          - { name: go1.26-linux-amd64, go: release-branch.go1.26, flags: -short }
          - { name: go1.27-linux-amd64, go: release-branch.go1.27, flags: -short }
          - { name: gotip-linux-amd64, flags: -short }
          - { name: gotip-linux-amd64-longtest, flags: -timeout=50m, longtest: true }
          - { name: gotip-linux-amd64-race, flags: -short -race -timeout=20m }
          - { name: gotip-linux-amd64_debian11, flags: -short, container: "buildpack-deps:bullseye" }
          - { name: gotip-linux-amd64_debian13, flags: -short, container: "buildpack-deps:trixie" }
          - { name: gotip-crosscompile-linux, ports: linux/386 linux/arm linux/arm64 linux/s390x }
          - { name: gotip-crosscompile-darwin-windows, ports: darwin/arm64 windows/amd64 windows/arm64 }
          - { name: gotip-crosscompile-wasm, ports: js/wasm wasip1/wasm }
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-22.04
    container: ${{ matrix.config.container }}
    env:
      # In the longtest builder, this makes "go test ./..." also run
      # TestIntegration, with the prebuilt protoc downloaded below.
      GO_BUILDER_NAME: z_protobuf-${{ matrix.config.name }}
    steps:
      - name: Checkout pending changes
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          # For forks, test the PR head.  Otherwise, use the default ref.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false
      - name: Install bootstrap Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version: stable
          # setup-go keys its cache to the bootstrap Go rather than the Go
          # version or container under test, so jobs would share a single cache
          # entry.  Disabling it starts every job with an empty cache so go test
          # always runs tests instead of reusing cached results across jobs or
          # runs.  This may be revisited later if we configure per-job cache
          # keys.
          cache: false
      - name: Install Go ${{ matrix.config.go || 'tip' }}
        run: |
          go install golang.org/dl/gotip@latest
          "$(go env GOPATH)/bin/gotip" download ${{ matrix.config.go }}
          echo "$HOME/sdk/gotip/bin" >> "$GITHUB_PATH"
      - name: Download prebuilt protoc
        if: ${{ matrix.config.longtest }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/protoc.zip" https://chrome-infra-packages.appspot.com/dl/golang/third_party/protoc_with_conformance/linux-amd64/+/version:v36.2
          unzip -q -d "$RUNNER_TEMP/protoc" "$RUNNER_TEMP/protoc.zip" protoc conformance_test_runner
          echo "$RUNNER_TEMP/protoc" >> "$GITHUB_PATH"
      - name: Run tests
        if: ${{ !matrix.config.ports }}
        run: go test ${{ matrix.config.flags }} ./...
      # Build the tests, without running them, for the main platforms besides
      # linux/amd64, and for 32-bit (386, arm), big-endian (s390x) and
      # WebAssembly ports, to catch code that doesn't compile there.  All
      # failures are reported at the end.
      - name: Compile tests for ${{ matrix.config.ports }}
        if: ${{ matrix.config.ports }}
        run: |
          failed=
          for port in ${{ matrix.config.ports }}; do
            GOOS=${port%/*} GOARCH=${port#*/} go test -c -o /dev/null ./... || failed="$failed $port"
          done
          test -z "$failed" || { echo "Failed to compile tests for:$failed"; exit 1; }

  remove-tag:
    name: Remove safety tag
    if: |
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == ':a: safe for tests'
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0  # v1.3.0
        with:
          fail_on_error: true
          labels: ':a: safe for tests'
